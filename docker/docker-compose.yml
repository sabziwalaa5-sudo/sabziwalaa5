version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sabjiwala5_db
    restart: always
    environment:
      POSTGRES_USER: sabjiwala_user
      POSTGRES_PASSWORD: sabjiwala_password
      POSTGRES_DB: sabjiwala5_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: sabjiwala5_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://sabjiwala_user:sabjiwala_password@postgres:5432/sabjiwala5_db?schema=public
      - PORT=4000
    depends_on:
      - postgres

  web:
    build:
      context: ../web
      dockerfile: ../docker/Dockerfile.web
    container_name: sabjiwala5_web
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:4000
    depends_on:
      - backend

volumes:
  pgdata:
